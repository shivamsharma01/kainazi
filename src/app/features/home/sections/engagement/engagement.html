<section class="section alt" id="approach">
  <div class="wrap">
    <div class="split">
      <div>
        <p class="eyebrow">Approach</p>
        <h2>Clear ways to begin.</h2>
      </div>
      <p>You speak with the people writing the code. We stay small on purpose.</p>
    </div>
    <ol>
      @for (model of content.engagementModels; track model.title; let i = $index) {
        <li>
          <span>0{{ i + 1 }}</span>
          <h3>{{ model.title }}</h3>
          <p>{{ model.summary }}</p>
        </li>
      }
    </ol>
  </div>
</section>
