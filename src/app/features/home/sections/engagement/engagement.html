<section class="section alt" id="approach">
  <div class="wrap">
    <div class="split">
      <div>
        <p class="eyebrow">Approach</p>
        <h2>Ways to start.</h2>
      </div>
      <p>A team on your product, a fixed build, or a slice of an older system. We agree that, then we get into the code.</p>
    </div>
    <ol>
      @for (model of content.engagementModels; track model.title; let i = $index) {
        <li>
          <span>0{{ i + 1 }}</span>
          <h3>{{ model.title }}</h3>
          <p>{{ model.summary }}</p>
        </li>
      }
    </ol>
  </div>
</section>
