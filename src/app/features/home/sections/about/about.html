<section class="about" id="about">
  <div class="wrap">
    <div class="split">
      <div>
        <p class="eyebrow">The team</p>
        <h2>Four engineers. No layers.</h2>
      </div>
      <p>The people who scope the work are the people who build it. There is no account team in between.</p>
    </div>
    <div class="roles">
      @for (member of content.team; track member.title) {
        <div>
          <span>{{ member.discipline }}</span>
          <strong>{{ member.title }}</strong>
        </div>
      }
    </div>
  </div>
</section>
