<section class="section" id="services">
  <div class="wrap">
    <div class="split">
      <div>
        <p class="eyebrow">Services</p>
        <h2>What we take on.</h2>
      </div>
      <p>Five things we do. Tell us which one you need, and we will get into it.</p>
    </div>
    <div class="grid">
      @for (service of content.services; track service.id) {
        <article>
          <h3>{{ service.title }}</h3>
          <p>{{ service.summary }}</p>
        </article>
      }
    </div>
  </div>
</section>
